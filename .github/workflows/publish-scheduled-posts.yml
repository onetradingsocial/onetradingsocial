# Publishes blog posts on their own date.
#
# A post in data/posts.json with a published_date in the future is built by
# nobody: scripts/build-blog.mjs filters it out, so it has no page, no card on
# /blog and no sitemap entry. This job rebuilds every morning and commits what
# changed, which is how a scheduled post becomes a live one — and a Vercel
# deploy follows the commit, as it does for any push to main.
#
# Vercel Hobby allows two daily crons and both are spoken for (crypto-sync,
# mt5-sync), so this lives in Actions like the other two.
#
# Nothing here decides anything: the date in data/posts.json is the schedule.
# To reschedule a post, change its date. To publish one now, set it to today
# (or run this workflow by hand).
name: Publish scheduled posts

on:
  schedule:
    # 00:20 UTC — just after the date rolls over for the UTC comparison the
    # build makes, so a post appears on the date it says.
    - cron: '20 0 * * *'
  workflow_dispatch:

concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # build-sitemap.mjs dates each static page from the last commit that
          # touched it, so the full history has to be here.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild the blog
        run: node scripts/build-blog.mjs

      - name: Commit anything that went live
        id: commit
        run: |
          git add -A blog blog.html sitemap.xml llms.txt
          if git diff --cached --quiet; then
            echo "nothing due today"
            exit 0
          fi
          # Name the posts in the message so the deploy is self-explaining. The
          # staged diff, not `git diff`: a post that goes live is a NEW file,
          # and a new file is invisible to an unstaged diff.
          new=$(git diff --cached --name-only --diff-filter=A -- blog/ | sed 's|blog/||; s|\.html$||')
          slugs=$(echo "$new" | paste -sd', ' -)
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(blog): publish scheduled post(s): ${slugs:-rebuild}" \
                     -m "Automated by .github/workflows/publish-scheduled-posts.yml. The date in data/posts.json is the schedule."
          git push
          # Newline-separated, for the IndexNow step below.
          {
            echo 'published<<EOF'
            echo "$new"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Bing and the other IndexNow consumers take a ping; Google does not
      # participate, so Search Console stays a manual job for now. The key file
      # at the site root is what proves we own the domain — see
      # docs/indexnow.md. A failure here must not fail the publish: the post is
      # already live, and the crawlers will find it from the sitemap anyway.
      - name: Tell IndexNow what went live
        if: steps.commit.outputs.published != ''
        continue-on-error: true
        run: |
          key=3e3bf9c898caa42b3cb08407a7711153
          urls=$(echo "${{ steps.commit.outputs.published }}" \
            | sed 's|^|"https://www.tradingsocial.io/blog/|; s|$|"|' | paste -sd, -)
          payload="{\"host\":\"www.tradingsocial.io\",\"key\":\"${key}\",\"keyLocation\":\"https://www.tradingsocial.io/${key}.txt\",\"urlList\":[${urls}]}"
          echo "$payload"
          # Give the deploy a moment: a URL that 404s when they fetch it is
          # worse than submitting it a little later.
          sleep 90
          code=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$payload")
          cat /tmp/indexnow.out; echo
          echo "HTTP ${code}"
          # 200 accepted, 202 accepted pending key validation.
          test "${code}" = "200" || test "${code}" = "202"
